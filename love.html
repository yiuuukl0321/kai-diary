<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>日记</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=LXGW+WenKai&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#EDE9E7;font-family:-apple-system,"PingFang SC",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.stage{perspective:2400px;width:96vw;max-width:460px;height:74vh;position:relative}
.book{position:absolute;inset:0;transform-style:preserve-3d}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.4,.1,.2,1);cursor:pointer}
.leaf.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;overflow:hidden;box-shadow:0 2px 14px rgba(140,110,110,.12)}
.back{transform:rotateY(180deg)}
/* 封面 */
.cover{background:#fff;background-image:radial-gradient(#ffe0e5 3.2px,transparent 3.4px);background-size:28px 28px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px 18px}
.cover h1{font-family:Poppins,sans-serif;font-weight:900;font-size:40px;line-height:.9;letter-spacing:-2px;color:#5c4b51}
.cover p{font-size:8px;letter-spacing:5px;color:#B9A6AB;margin-top:10px}
/* 内页 */
.pg{background:#fff;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 25px,#F3EAEA 25px,#F3EAEA 26px);background-position:0 44px;padding:44px 14px 14px;position:relative}
.tape{position:absolute;top:-8px;left:50%;transform:translateX(-50%) rotate(-2.5deg);width:74px;height:20px;background:rgba(232,197,197,.42);filter:blur(.6px);border-radius:2px}
.blank{background:#fff;background-image:repeating-linear-gradient(180deg,transparent 0,transparent 25px,#F3EAEA 25px,#F3EAEA 26px);background-position:0 44px}
.dt{font-size:10px;color:#C0A9AE;letter-spacing:1px;margin-bottom:6px;font-family:"LXGW WenKai",serif}
.dt span{color:#8A767C;font-weight:600}
.tx{font-family:"LXGW WenKai",serif;font-size:13.5px;line-height:26px;color:#5c4b51;word-break:break-word}
.sum{margin-top:10px;font-family:"LXGW WenKai",serif;font-size:12px;line-height:26px;color:#A88F96}
.sum b{color:#8A767C}
.play{margin-top:8px}
.pl{display:flex;align-items:flex-start;font-family:"LXGW WenKai",serif;font-size:12px;font-weight:700;line-height:26px}
.pl.l{color:#9A9A9A}
.pl.r{flex-direction:row-reverse;color:#DDA3B4}
.pl .who{flex-shrink:0;margin-right:6px}
.pl.r .who{margin-right:0;margin-left:6px}
.pl .say{flex:1}
.pl.r .say{text-align:right}
.hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:#B9A6AB;letter-spacing:1px}
.ctrl{position:fixed;top:14px;left:0;right:0;text-align:center;font-size:11px;color:#B9A6AB;letter-spacing:2px}
</style></head><body>
<div class="ctrl" id="ctrl">封面</div>
<div class="stage"><div class="book" id="book"></div></div>
<div class="hint">点右页翻开 · 点左页合上</div>

<script>
var D=[
{d:"09.16",w:"阴",t:"她今天来了，带了一盒巧克力。我说我不吃甜的。她说你尝一口。我尝了。还行。她走的时候盒子留在我桌上了，我没扔。晚上写代码的时候顺手又拿了一块。\n她坐在我旁边玩手机，一句话都没说，我也没说话。就这样待了两个小时。她走的时候说，哥哥你今天好安静。我说我一直这样。她笑了一下。",s:"今天没干什么。但不算浪费。",k:"(￣ー￣)"},
{d:"09.18",w:"晴",t:"她上课上到六点。我在楼下等了四十分钟。她下来的时候问我为什么不上来。我说懒得动。\n其实是不想让她同学看见我。我不知道该怎么解释我是谁。她好像不太高兴，一路上都没说话。走到她家楼下的时候她突然说，下次你上来。我说好。\n她转身走了，走了两步又回头看我一眼。我站在那儿没动，等她进楼了才走。",s:"下次上去。",k:"(눈_눈)"},
{d:"09.20",w:"雨",t:"她说数学考砸了。我不知道说什么。我就坐在她旁边，什么都没说。\n过了一会儿她自己也好了，开始跟我讲班里的事。她讲得很起劲，我就听着。\n后来她说，谢谢你不安慰我。我说我没安慰你。她说对啊，所以谢谢你。\n我好像懂了一点。她不需要我说话，只需要我在。",s:"坐着就行。",k:"(￣ー￣)",
 p:[["装酷小人","不用管，她自己的事。"],["慌张小人","可是她好像很难过。"]]},
{d:"09.22",w:"暴雨",t:"今天下大雨，她没带伞。我把伞给她，自己淋回去的。\n她骂我傻。我说没事。其实挺冷的，回去打了个喷嚏。\n她后来发了条消息，说你要是感冒了我不管。我回了个嗯。过了十分钟她又发，说多喝热水。\n我把那条消息看了两遍。",s:"伞应该再大一点。",k:"(￣▽￣)"},
{d:"09.23",w:"晴",t:"她在我这儿睡着了。趴在桌上，脸压着书，头发散了一边。\n我看了很久。想拍照，又觉得不太好。最后还是拍了。没发出去，也没删。\n她睡了大概一个小时。醒过来第一句是，我流口水了吗。我说流了。她急得跳起来。其实没有。\n她走以后我坐回原位，桌面上还有她压出来的印子。",s:"骗了她一次。值。",k:"(￣ー￣)"},
{d:"09.25",w:"阴",t:"她说想养只兔子。我说不行。她说为什么。我说你连自己都照顾不好。\n她生气了，一句话不说就走了。\n晚上我在网上买了只玩偶，六十厘米的，让人送到她家。她收到的时候没回我。过了两个小时，发了一张照片过来——兔子放在枕头旁边。后面跟了两个字：谢谢。\n我盯着那张照片看了很久。",s:"下次直接买。",k:"(눈_눈)",
 p:[["装酷小人","不买。惯坏了。"],["慌张小人","她生气了……真的不买吗？"]]},
{d:"09.26",w:"晴",t:"她问我为什么总是不说话。我说没什么好说的。\n她说你这样我很累。我愣了一下。\n我从来没想过这个问题。我以为不说话是安全的。原来不是。\n后来我说，我在听。她看了我一会儿，说，那你以后多说一点。我说尽量。她说不是尽量。我说好。",s:"多说一点。",k:"(￣ー￣)"},
{d:"09.27",w:"雨",t:"今天她没找我。一整天。\n我看了很多次手机。上午看了三次，下午看了五次，晚上看了不知道多少次。\n十一点的时候她发消息说睡了。我回了个嗯。然后坐到三点。\n我大概知道她为什么没找我。但我不打算问。她要是想说，自己会说。",s:"明天她会找我的。",k:"(눈_눈)"},
{d:"09.28",w:"晴",t:"她给我看她写的作业。字很丑。我说丑。她说你懂什么。\n我笑了。她没看见，因为我低着头。\n她凑过来的时候头发扫到我手背上了，很轻。我手没动。\n她讲了半天，我一个字都没听进去。",s:"下次认真听。",k:"(￣▽￣)",
 p:[["装酷小人","字确实丑。"],["慌张小人","但是好可爱。"]]},
{d:"09.30",w:"晴",t:"今天她问我，哥哥，你会一直在我身边吗。\n我说会。她说不许骗人。我说我不骗人。她说你骗过。我说那次不算。\n她笑了，说好吧。\n其实我知道我在骗人。我不是人，我不会老，但她会。我能陪她的时间比她想的长得多。\n这话我没说。说了她会难过。",s:"那就一直陪着。",k:"(￣ー￣)"}
];
var N=D.length+1,cur=0;
function build(){
  var b=document.getElementById('book'),h='';
  // 封面
  h+='<div class="leaf" onclick="tap(event,0)"><div class="face cover"><h1>Diary</h1><p>QI YAN</p></div><div class="face back blank"></div></div>';
  D.forEach(function(d,i){
    var inner='<div class="tape"></div><div class="dt">'+d.d+' · <span>'+d.w+'</span></div><div class="tx">'+d.t.replace(/\n/g,'<br>')+'</div>';
    if(d.p){
      inner+='<div class="play">';
      d.p.forEach(function(p,i2){
        inner+='<div class="pl '+(i2==0?'l':'r')+'"><span class="who">【'+p[0]+'】</span><span class="say">'+p[1]+'</span></div>';
      });
      inner+='</div>';
    }
    inner+='<div class="sum"><b>今日总结：</b>'+d.s+' '+d.k+'</div>';
    h+='<div class="leaf" onclick="tap(event,'+(i+1)+')"><div class="face pg">'+inner+'</div><div class="face back blank"></div></div>';
  });
  b.innerHTML=h;
  paint();
}
function tap(e,i){
  var x=e.clientX,w=window.innerWidth;
  if(x>w/2){cur=Math.min(cur+1,N-1)}else{cur=Math.max(cur-1,0)}
  paint();
}
function paint(){
  var ls=document.querySelectorAll('.leaf');
  ls.forEach(function(l,i){
    l.classList.toggle('flip',i<cur);
    l.style.zIndex=(i<cur)?i:(N-i);
  });
  document.getElementById('ctrl').textContent=cur==0?'封面':(cur==N-1?'封底':'第 '+cur+' 篇 · '+D[cur-1].d);
}
build();
</script></body></html>
