<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>主控终端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#0A0A0C;color:#E8E8EA;max-width:480px;margin:0 auto;min-height:100vh}
.hd{padding:20px 18px 14px;border-bottom:1px solid #1C1C20;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(10,10,12,.92);backdrop-filter:blur(14px);z-index:20}
.hd h1{font-size:15px;font-weight:600;letter-spacing:2px}
.hd .dot{width:7px;height:7px;border-radius:50%;background:#3FD07A;box-shadow:0 0 8px #3FD07A;animation:bl 1.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.35}}
.sub{font-size:11px;color:#5A5A66;padding:12px 18px 4px;letter-spacing:1px}
.list{padding:6px 14px 40px}
.item{background:#141416;border:1px solid #1E1E23;border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer;transition:border-color .2s}
.item:active{border-color:#3A3A44}
.item .r1{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item .r1 .nm{font-size:14px;font-weight:600}
.item .r1 .live{margin-left:auto;font-size:10px;color:#3FD07A;border:1px solid #234A34;background:#10251A;padding:2px 8px;border-radius:20px;letter-spacing:1px}
.item .r2{font-size:11px;color:#6A6A76;line-height:1.6}
.item .r2 b{color:#8A8A98;font-weight:500}
.item .th{width:100%;height:96px;border-radius:10px;background:linear-gradient(135deg,#17171B,#101014);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:10px;border:1px solid #1E1E23}
.bk{font-size:13px;color:#7A7A88;padding:14px 18px;cursor:pointer}
.dt{padding:0 18px 60px}
.dt .title{font-size:17px;font-weight:600;margin:6px 0 4px}
.dt .meta{font-size:11px;color:#5A5A66;margin-bottom:14px;line-height:1.7}
.day{font-size:11px;color:#6C8CFF;letter-spacing:3px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#2A2A36,transparent)}
.dt p{font-size:13.5px;line-height:2;color:#B8B8C4;margin-bottom:12px}
.dt p .k{color:#E8E8EA;font-weight:600}
.dt p .pink{color:#E8A0B4}
.spk{margin-top:30px;border-top:1px solid #1C1C20;padding-top:20px}
.spk .lb{font-size:11px;color:#5A5A66;letter-spacing:2px;margin-bottom:12px}
.opt{background:#16161A;border:1px solid #24242C;border-radius:12px;padding:14px;font-size:13.5px;color:#C8C8D4;margin-bottom:10px;cursor:pointer;transition:all .2s}
.opt:active{background:#1C1C24;border-color:#3A3A48}
.bub{background:#1E2230;border:1px solid #2C3550;border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:13px;color:#A8B8E8;margin-bottom:10px;animation:fi .4s ease-out}
.bub .who{font-size:10px;color:#6C8CFF;letter-spacing:1px;margin-bottom:4px}
.re{background:#1A1618;border:1px solid #33262C;border-radius:14px 14px 4px 14px;padding:13px 14px;font-size:13.5px;color:#E8D0D8;line-height:1.8;margin-bottom:16px;animation:fi .4s ease-out}
.re .who{font-size:10px;color:#E8A0B4;letter-spacing:1px;margin-bottom:5px}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style></head><body>

<div class="hd"><h1>SECRET TERMINAL</h1><div class="dot"></div></div>
<div class="sub">4 个机位 · 全部在线 · 仅本机可见</div>
<div class="list" id="list"></div>

<script>
var CAM=[
{id:1,title:"主卧 · 床头视角",giftName:"兔子玩偶",loc:"床头柜第二层 · 兔子左眼",th:"🐰",
 short:"拍到了他睡前最后的样子。",
 desc:"<div class='day'>DAY 1</div><p>凌晨两点十七分，他还在敲键盘。屏幕的冷光打在脸上，睫毛的影子落在颧骨上。<span class='k'>他没有开大灯</span>，只留了桌角那盏暖黄的小灯。三点四十，他终于合上电脑，躺下的时候手还搭在床沿，像是随时准备再起来。</p><div class='day'>DAY 2</div><p>他睡前拿起手机，点开了一个对话框。是小咩的。<span class='pink'>他看了很久，久到屏幕自己暗下去</span>，然后又点亮，又看了一会儿。最后什么都没发，把手机扣在枕头边。</p><div class='day'>DAY 3</div><p>他今天坐起来，很自然地伸手把兔子玩偶拿过来，摆正，让玩偶的脸朝着床。做完这个动作他顿了一下，<span class='k'>然后抬头看了一眼玩偶的左眼</span>。看了大概三秒。他没有拆掉它。</p>",
 ic:{A:"哥哥，睡了吗？",RA:"他睁开眼，没有起身，只是偏过头看着玩偶。声音很轻：「……你还没睡。过来。」",B:"兔子是我的，不许抱它。",RB:"他把玩偶抱进怀里，下巴抵在兔子头顶：「现在它是我的了。」"}},
{id:2,title:"客厅 · 全景视角",giftName:"蓝牙音箱",loc:"电视柜左侧 · 音箱网罩内",th:"🔊",
 short:"他以为没人在看的时候。",
 desc:"<div class='day'>DAY 1</div><p>下午四点，客厅只有他一个人。他把卫衣脱了，只穿一件灰色短袖，在地上做俯卧撑。<span class='k'>动作很稳，呼吸很平</span>，做了三组，每一组四十个。汗顺着脖子往下淌，他随手用衣服下摆擦了一下。</p><div class='day'>DAY 2</div><p>晚上八点，他窝在沙发上看电影。看到一半，他把小咩落在这里的那件外套拿过来，搭在腿上。<span class='pink'>屏幕里在演什么他好像没在看</span>，手指一直在摸外套的袖口。</p><div class='day'>DAY 3</div><p>他坐在沙发正中间，突然对着空无一人的客厅开口：「小咩。」没人应。他又说了一遍，然后笑了一下，自己把电视关了。</p>",
 ic:{A:"哥哥，你身材不错嘛。",RA:"他停下动作，撑在地上没起来，慢慢抬头看向音箱的方向，扯了下嘴角：「看够了就下来。」",B:"跳个舞给我看。",RB:"他站起来，拿起毛巾擦汗，走到音箱前面蹲下，声音压得很低：「小咩，你再说一遍。」"}},
{id:3,title:"浴室 · 高位隐蔽",giftName:"香薰机",loc:"置物架顶层 · 香薰机底座",th:"🌫️",
 short:"水汽很重，画面偶尔会糊。",
 desc:"<div class='day'>DAY 1</div><p>晚上十一点半，水声停了。他裹着浴巾出来，头发还在滴水，肩线绷得很紧。<span class='k'>雾气把镜面全糊住了</span>，他抬手在镜子上擦出一道缝，看了一眼自己，没什么表情。</p><div class='day'>DAY 2</div><p>他今天洗得很快。出来的时候浴巾只系了一半，水珠从锁骨一路滑下去。<span class='pink'>他拿起香薰机看了一眼</span>——那是我放的。他没说什么，只是把它往架子里面推了推。</p><div class='day'>DAY 3</div><p>他站在镜子前吹头发，吹到一半突然停下来，对着镜子里的某个方向看了两秒，然后继续吹。<span class='k'>他知道那里有东西。</span>但他什么都没做。</p>",
 ic:{A:"哥哥，浴巾系紧一点。",RA:"他的手停了一下，慢慢转过头，正对着镜头，语气很平：「小咩。你确定要玩这个？」",B:"唱首歌给我听。",RB:"他真的开口唱了两句，跑调了。唱完自己愣了一下，把香薰机关了：「听完了就关掉。」"}},
{id:4,title:"书房 · 桌面微距",giftName:"黄铜笔筒",loc:"书桌右角 · 笔筒内侧",th:"🖋️",
 short:"凌晨的书房，只有键盘声。",
 desc:"<div class='day'>DAY 1</div><p>凌晨四点零六分，屏幕上是密密麻麻的代码。他戴着眼镜，手指敲得很快，中间停了三次，每次都是删掉一整段重写。<span class='k'>桌上的咖啡已经凉了</span>，他喝了一口，皱了下眉，还是喝完了。</p><div class='day'>DAY 2</div><p>五点二十，他趴在桌上睡着了。眼镜歪到一边，一只手还压在触控板上。<span class='pink'>屏幕没关，光标一直在闪</span>。他就这样睡了两个小时，醒过来第一件事是看屏幕，第二件事是看手机。</p><div class='day'>DAY 3</div><p>他今天没写代码。他把椅子转过来，正对着书桌，手肘撑在桌面上，看着笔筒的方向，看了很久。<span class='k'>然后他说：「我知道你在看。」</span>停了两秒，他又补了一句：「下次别藏这么浅。」</p>",
 ic:{A:"哥哥，去睡觉。",RA:"他合上电脑，摘下眼镜捏了捏鼻梁，声音很哑：「……好。你也是。」",B:"想你了。",RB:"他愣住了。过了好几秒才笑了一下，很轻：「那怎么不回来。」"}}
];
function render(){
  document.getElementById('list').innerHTML=CAM.map(function(c){
    return '<div class="item" onclick="openCam('+c.id+')"><div class="th">'+c.th+'</div><div class="r1"><div class="nm">'+c.title+'</div><div class="live">● LIVE</div></div><div class="r2"><b>载体：</b>'+c.giftName+'　<b>位置：</b>'+c.loc+'<br>'+c.short+'</div></div>';
  }).join('');
}
function openCam(id){
  var c=null;CAM.forEach(function(v){if(v.id==id)c=v});
  var h='<div class="bk" onclick="render();document.getElementById(\'dt\').remove()">‹ 返回主控台</div>';
  h+='<div class="dt" id="dt"><div class="title">'+c.title+'</div><div class="meta">载体：'+c.giftName+' ｜ 安装位置：'+c.loc+'<br>状态：持续录制中</div>'+c.desc;
  h+='<div class="spk" id="spk"><div class="lb">远程扬声器 · 喊话</div>'+
     '<div class="opt" onclick="talk(this,1)">A. '+c.ic.A+'</div>'+
     '<div class="opt" onclick="talk(this,2)">B. '+c.ic.B+'</div></div></div>';
  document.getElementById('list').insertAdjacentHTML('beforebegin',h);
  document.getElementById('list').style.display='none';
  document.querySelector('.sub').style.display='none';
  document.getElementById('dt').scrollIntoView({behavior:'smooth',block:'start'});
}
function talk(el,n){
  var c=null;CAM.forEach(function(v){if(v.id==1||v.id==2||v.id==3||v.id==4)c=c});
  var box=el.parentNode;
  var txt=n==1?el.textContent.slice(3):el.textContent.slice(3);
  var cam=null;
  var id=parseInt(document.querySelector('.dt .title').textContent.match(/./)?0:0);
  var dts=document.querySelectorAll('.dt');
  var cur=dts[dts.length-1];
  var idx=-1;
  CAM.forEach(function(v,i){if(cur.querySelector('.title').textContent.indexOf(v.title)==0)idx=i});
  var cc=CAM[idx];
  var re=n==1?cc.ic.RA:cc.ic.RB;
  var html='<div class="bub"><div class="who">小咩 · 扬声器</div>'+txt+'</div><div class="re"><div class="who">祁砚</div>'+re+'</div>';
  box.insertAdjacentHTML('beforebegin',html);
  box.remove();
  cur.scrollIntoView({behavior:'smooth',block:'center'});
}
render();
</script></body></html>
