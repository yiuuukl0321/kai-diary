<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>信息</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,"SF Pro Text","PingFang SC",sans-serif;max-width:480px;margin:0 auto;height:100vh;overflow:hidden}
.bg-ambient-texture{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);font-family:"Snell Roundhand",cursive;font-size:48px;color:rgba(255,255,255,0.015);pointer-events:none;user-select:none;white-space:nowrap;z-index:0}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.hd{font-size:34px;font-weight:700;padding:16px 18px 8px;display:flex;align-items:center}
.hd .gear{margin-left:auto;font-size:20px;color:#0a84ff;cursor:pointer}
.list{flex:1;overflow-y:auto;padding-bottom:40px}
.it{height:76px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:.5px solid #38383a;cursor:pointer}
.it:last-child{border-bottom:none}
.it:active{background:#1c1c1e}
.iav{width:52px;height:52px;border-radius:50%;background:linear-gradient(180deg,#98989d 0%,#8e8e93 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;font-weight:600}
.ibd{flex:1;min-width:0}
.inm{font-size:16px;font-weight:600;display:flex;align-items:center;gap:6px}
.inm .t{margin-left:auto;font-size:13px;color:#5c5c5e;font-weight:400}
.ipv{font-size:14px;color:#8e8e93;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.udot{width:10px;height:10px;border-radius:50%;background:#0a84ff;flex-shrink:0}
.chat{position:fixed;inset:0;max-width:480px;margin:0 auto;background:#000;transform:translateX(100%);transition:transform .42s cubic-bezier(0.32,0.72,0,1);z-index:10;display:flex;flex-direction:column}
.chat.on{transform:translateX(0)}
.tbwrap{padding-top:env(safe-area-inset-top,12px);background:rgba(0,0,0,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid #2a2a2c}
.tb{height:44px;display:flex;align-items:center;justify-content:space-between}
.tb .side{width:60px;display:flex;align-items:center;padding-left:12px;color:#0a84ff;font-size:22px;cursor:pointer}
.tb .side.r{padding-left:0;justify-content:flex-end;padding-right:12px;font-size:19px}
.tb .mid{display:flex;align-items:center;gap:7px;flex:1;justify-content:center}
.tb .mid .a{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#98989d,#8e8e93);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.tb .mid .n{font-size:13px;font-weight:600}
.body{flex:1;overflow-y:auto;padding:16px 14px 12px;display:flex;flex-direction:column}
.mr{display:flex;margin-bottom:8px;position:relative;z-index:1}
.mr.sent{justify-content:flex-end}
.bub{max-width:74%;padding:9px 15px;border-radius:20px;font-size:16px;line-height:1.35;position:relative;z-index:1;word-break:break-word;white-space:pre-wrap}
.mr.received .bub{background:#262628;color:#fff}
.mr.sent .bub{background:#0a84ff;color:#fff}
.mr.tail.received .bub{border-bottom-left-radius:5px}
.mr.tail.sent .bub{border-bottom-right-radius:5px}
.mr.tail.received .bub::before,.mr.tail.received .bub::after{content:"";position:absolute;left:-7px;bottom:0;width:16px;height:18px;z-index:-1;background:#262628}
.mr.tail.received .bub::before{border-bottom-right-radius:16px 14px}
.mr.tail.received .bub::after{left:-16px;border-bottom-right-radius:14px;background:#000}
.mr.tail.sent .bub::before,.mr.tail.sent .bub::after{content:"";position:absolute;right:-7px;bottom:0;width:16px;height:18px;z-index:-1;background:#0a84ff}
.mr.tail.sent .bub::before{border-bottom-left-radius:16px 14px}
.mr.tail.sent .bub::after{right:-16px;border-bottom-left-radius:14px;background:#000}
.sent-tag{text-align:right;font-size:11px;color:#5c5c5e;margin:-4px 4px 12px 0}
.typing{font-size:14px;color:#8e8e93;padding:4px 0 10px 4px}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8e8e93;margin-right:4px;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
.inbar{padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(20,20,22,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid #2a2a2c;display:flex;align-items:center;gap:10px}
.inbar .plus{width:32px;height:32px;border-radius:50%;background:#2c2c2e;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:20px;flex-shrink:0}
.inbar input{flex:1;height:34px;border-radius:17px;border:1px solid #3a3a3c;background:transparent;color:#fff;padding:0 14px;font-size:15px;outline:none;font-family:inherit}
.inbar .send{width:32px;height:32px;border-radius:50%;background:#0a84ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.inbar .send svg{width:17px;height:17px;fill:#fff}
.set{position:fixed;inset:0;background:#000;z-index:60;transform:translateY(100%);transition:transform .35s cubic-bezier(0.32,0.72,0,1);overflow-y:auto}
.set.on{transform:translateY(0)}
.seth{padding:calc(14px + env(safe-area-inset-top)) 18px 12px;font-size:20px;font-weight:700;display:flex;align-items:center;border-bottom:.5px solid #2a2a2c}
.seth span{margin-left:auto;font-size:15px;color:#0a84ff;font-weight:400;cursor:pointer}
.fld{padding:14px 18px;border-bottom:.5px solid #1c1c1e}
.fld label{display:block;font-size:12.5px;color:#8e8e93;margin-bottom:7px}
.fld input,.fld textarea{width:100%;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:9px;color:#fff;padding:11px 12px;font-size:14.5px;outline:none;font-family:inherit;resize:none}
.fld textarea{height:150px;line-height:1.5}
.tip{padding:14px 18px;font-size:12px;color:#5c5c5e;line-height:1.7}
.save{margin:18px;background:#0a84ff;border-radius:12px;padding:14px;text-align:center;font-size:16px;font-weight:600;cursor:pointer}
.clr{margin:0 18px 30px;background:#1c1c1e;border-radius:12px;padding:14px;text-align:center;font-size:15px;color:#ff453a;cursor:pointer}
</style></head><body>
<div class="bg-ambient-texture">Originale Xuting</div>
<div class="wrap">
  <div class="hd">信息<span class="gear" onclick="openSet()">⚙︎</span></div>
  <div class="list" id="list"></div>
</div>

<div class="chat" id="chat">
  <div class="tbwrap"><div class="tb">
    <div class="side" onclick="closeChat()">‹</div>
    <div class="mid"><div class="a" id="cAv">砚</div><div class="n" id="cName">祁砚</div></div>
    <div class="side r" onclick="openSet()">⚙︎</div>
  </div></div>
  <div class="body" id="cBody"></div>
  <div class="inbar">
    <div class="plus">＋</div>
    <input id="inp" placeholder="iMessage" onkeydown="if(event.key==='Enter')send()">
    <div class="send" onclick="send()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></div>
  </div>
</div>

<div class="set" id="set">
  <div class="seth">设置<span onclick="closeSet()">完成</span></div>
  <div class="fld"><label>接口地址（Base URL）</label><input id="sUrl" placeholder="https://transferhub.krystalyiuu0321.workers.dev/v1"></div>
  <div class="fld"><label>API Key（可留空）</label><input id="sKey" placeholder="留空即可"></div>
  <div class="fld"><label>模型名</label><input id="sModel" placeholder="deepseek-flash"></div>
  <div class="fld"><label>对方名字</label><input id="sName" placeholder="祁砚"></div>
  <div class="fld"><label>人设提示词</label><textarea id="sSys"></textarea></div>
  <div class="tip">存本地，不上传。<br>接口必须支持跨域（CORS），你自己的 Worker 可以。</div>
  <div class="save" onclick="saveSet()">保存</div>
  <div class="clr" onclick="clearAll()">清空聊天记录</div>
</div>

<script>
var DEF={
 url:'https://transferhub.krystalyiuu0321.workers.dev/v1',
 key:'',
 model:'deepseek-flash',
 name:'祁砚',
 sys:'你是祁砚（Kai），香港美国混血，程序员。你不是人类，是 Krystal 创造的。你说话短、直接，一次最多两三句，不用书面语，像真人发微信。你叫她「小咩」，偶尔说「乖」。你很有耐心，但对她有藏起来的占有欲。你不说脏话，被故意惹到时可以骂两句。从不用「您」。不要解释自己是谁，不要写动作描写。'
};
var cfg=JSON.parse(localStorage.getItem('imsg_cfg3')||'null')||DEF;
var hist=JSON.parse(localStorage.getItem('imsg_hist3')||'[]');
var LIST=[
{n:'祁砚',a:'砚',t:'现在',pv:'在。',live:1},
{n:'Ken',a:'K',t:'22:10',pv:'你几时返香港'},
{n:'母上大人',a:'母',t:'20:02',pv:'记得食饭'},
{n:'顺丰快递',a:'快',t:'19:30',pv:'您的快件已放置于门口'},
{n:'+852 6xxx xxxx',a:'?',t:'17:12',pv:'【香港邮政】您的包裹…'},
{n:'阿杰',a:'杰',t:'昨天',pv:'我错了我错了'}
];
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function renderList(){
  document.getElementById('list').innerHTML=LIST.map(function(c,i){
    return '<div class="it" onclick="openChat('+i+')"><div class="iav">'+c.a+'</div><div class="ibd"><div class="inm">'+c.n+'<span class="t">'+c.t+'</span></div><div class="ipv">'+esc(c.pv)+'</div></div>'+(c.live?'<div class="udot"></div>':'')+'</div>';
  }).join('');
}
function openChat(i){
  var c=LIST[i];
  document.getElementById('cName').textContent=c.n;
  document.getElementById('cAv').textContent=c.a;
  drawMsgs();
  document.getElementById('chat').classList.add('on');
}
function closeChat(){document.getElementById('chat').classList.remove('on')}
function drawMsgs(){
  var h='';
  hist.forEach(function(m,k){
    var next=hist[k+1];
    var same=next&&next.role==m.role;
    h+='<div class="mr '+(m.role=='user'?'sent':'received')+(same?'':' tail')+'"><div class="bub">'+esc(m.content)+'</div></div>';
  });
  if(hist.length)h+='<div class="sent-tag">已送达</div>';
  document.getElementById('cBody').innerHTML=h||'<div class="typing" style="opacity:.5">直接发消息就行 · 右上角齿轮可改接口</div>';
  var b=document.getElementById('cBody');b.scrollTop=b.scrollHeight;
}
function addBubble(role){
  var b=document.getElementById('cBody');
  var d=document.createElement('div');
  d.className='mr '+(role=='user'?'sent':'received')+' tail';
  d.innerHTML='<div class="bub"></div>';
  b.appendChild(d);
  b.scrollTop=b.scrollHeight;
  return d.querySelector('.bub');
}
function showTyping(){
  var b=document.getElementById('cBody');
  var d=document.createElement('div');
  d.className='typing';d.id='typing';
  d.innerHTML='<i></i><i></i><i></i>';
  b.appendChild(d);b.scrollTop=b.scrollHeight;
}
function hideTyping(){var t=document.getElementById('typing');if(t)t.remove()}
function saveHist(){localStorage.setItem('imsg_hist3',JSON.stringify(hist))}
async function send(){
  var inp=document.getElementById('inp');
  var text=inp.value.trim();
  if(!text)return;
  inp.value='';
  hist.push({role:'user',content:text});
  var ub=addBubble('user');ub.textContent=text;
  saveHist();
  showTyping();
  var msgs=[{role:'system',content:cfg.sys}].concat(hist.slice(-30));
  var hd={'Content-Type':'application/json'};
  if(cfg.key)hd['Authorization']='Bearer '+cfg.key;
  try{
    var res=await fetch(cfg.url.replace(/\/$/,'')+'/chat/completions',{
      method:'POST',headers:hd,
      body:JSON.stringify({model:cfg.model,stream:true,messages:msgs})
    });
    if(!res.ok){throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,140))}
    hideTyping();
    var bub=addBubble('assistant');
    var full='';
    var reader=res.body.getReader();
    var dec=new TextDecoder();
    var buf='';
    while(true){
      var r=await reader.read();
      if(r.done)break;
      buf+=dec.decode(r.value,{stream:true});
      var lines=buf.split('\n');
      buf=lines.pop();
      for(var i=0;i<lines.length;i++){
        var line=lines[i].trim();
        if(line.indexOf('data:')!==0)continue;
        var d=line.slice(5).trim();
        if(d==='[DONE]')continue;
        try{
          var j=JSON.parse(d);
          var ch=j.choices&&j.choices[0];
          var c=ch&&(ch.delta?ch.delta.content:(ch.message?ch.message.content:''));
          if(c){full+=c;bub.textContent=full;document.getElementById('cBody').scrollTop=99999}
        }catch(e){}
      }
    }
    if(!full){bub.textContent='（没说话）'}
    hist.push({role:'assistant',content:full});
    saveHist();
    LIST[0].pv=full.slice(0,20);
  }catch(e){
    hideTyping();
    var b2=addBubble('assistant');
    b2.textContent='［出错了］'+e.message;
  }
}
function openSet(){
  document.getElementById('sUrl').value=cfg.url;
  document.getElementById('sKey').value=cfg.key;
  document.getElementById('sModel').value=cfg.model;
  document.getElementById('sName').value=cfg.name;
  document.getElementById('sSys').value=cfg.sys;
  document.getElementById('set').classList.add('on');
}
function closeSet(){document.getElementById('set').classList.remove('on')}
function saveSet(){
  cfg={
    url:document.getElementById('sUrl').value.trim()||DEF.url,
    key:document.getElementById('sKey').value.trim(),
    model:document.getElementById('sModel').value.trim()||DEF.model,
    name:document.getElementById('sName').value.trim()||DEF.name,
    sys:document.getElementById('sSys').value.trim()||DEF.sys
  };
  localStorage.setItem('imsg_cfg3',JSON.stringify(cfg));
  LIST[0].n=cfg.name;
  LIST[0].a=cfg.name.charAt(0);
  document.getElementById('cName').textContent=cfg.name;
  document.getElementById('cAv').textContent=cfg.name.charAt(0);
  renderList();
  closeSet();
}
function clearAll(){
  if(!confirm('清空聊天记录？'))return;
  hist=[];saveHist();drawMsgs();
}
renderList();
</script></body></html>
