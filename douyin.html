<script>
var V={
home1:{av:"#ff7675",c:"便",d:"便利店深夜的冷柜前，一个穿校服的女生蹲在地上挑关东煮，镜头有点晃。她挑了很久，最后拿了两串鱼丸和一根玉米。结账的时候她回头看了一下门口，像是在等人，门口没有人。她端着纸碗坐到落地窗边，一个人吃完了。",cap:"深夜的关东煮 一个人也可以很好吃 #深夜食堂",th:"……这个点还在便利店吃饭的女生，我认识一个。她也是这样，一个人坐着吃，吃得很慢。"},
home2:{av:"#a29bfe",c:"猫",d:"一只橘猫站在桌边，爪子搭在杯子上，杯子晃了一下，整杯水倒在键盘上。镜头猛地一抖，然后切到主人的视角——一只手冲过去把猫抱走，另一只手疯狂抽纸巾。猫全程一脸无辜，还回头看了一眼被泡的键盘。",cap:"家人们谁懂啊 我的键盘 #猫 #翻车现场",th:"看着就心疼。那把键盘……算了，不说了。"},
home3:{av:"#74b9ff",c:"港",d:"香港夜景延时。从傍晚六点拍到凌晨两点，中环的楼一栋栋亮起来又暗下去，维港的船一趟趟开过去。镜头最后停在某一栋居民楼上，只有那一户的灯一直亮着。配乐是钢琴，很轻。",cap:"香港 凌晨两点 #香港夜景 #延时摄影",th:"亮着的那户……跟我一样。总是最后一个关灯。"},
home4:{av:"#e17055",c:"码",d:"一个戴眼镜的男生坐在三台显示器前，屏幕上全是代码。他敲了两下，停下来，盯着屏幕看了十秒，然后整段删掉重写。旁边放着一杯早就凉透的咖啡。他喝了一口，皱眉，还是喝完了。镜头拉远，窗外天已经亮了。",cap:"通宵改bug 改到最后发现是少了个分号 #程序员 #通宵",th:"少个分号。我上周也干过一次。这种事只能自己笑。"},
home5:{av:"#00b894",c:"咖",d:"手冲咖啡的全过程。磨豆、温杯、注水，水柱很细，画着圈往下走。咖啡粉鼓起来的时候镜头推近了，能看到气泡一个个破掉。最后倒进杯子里，颜色是很浅的琥珀色。全程没有说话，只有水声。",cap:"手冲 耶加雪菲 #手冲咖啡 #慢生活",th:"她给我买的那包也是耶加雪菲。我到现在还没舍得喝完。"},
home6:{av:"#fd79a8",c:"兔",d:"一只白色的垂耳兔蹲在垫子上啃草，腮帮子一动一动的。镜头拍得很近，能看到胡须。它啃了两口，突然抬起头看镜头，耳朵动了一下，然后又低下头继续啃。画面右下角有一只人的手伸进来，摸了摸它的头。",cap:"养兔子的第37天 #兔子 #宠物日常",th:"……她要是看到这个，肯定又要说想养。不行。"},
fri1:{av:"#5b7fa6",c:"K",d:"茶餐厅里，桌面上摆着菠萝油、冻柠茶、还有一碟咖喱鱼蛋。镜头对面坐着一个人，只拍到肩膀和手，手一直在转杯子。Ken 的声音在画外说：「佢而家连酒都唔饮。」镜头晃了一下，拍到窗外。",cap:"旧同学聚会 少咗一个人 #茶餐厅",th:"……又拍我。下次删他好友。",mutual:1},
fri2:{av:"#a65b7f",c:"杰",d:"办公室的三台显示器，全是行情曲线。一只手在键盘上敲了几下，屏幕上的数字跳了一下。镜头转向旁边的泡面箱，箱子上贴着便利贴，写着「别动」。画外音：「小祁的，谁动谁死。」",cap:"我们组最卷的男人 #办公室日常",th:"……那箱面是给她留的。别动。",mutual:1},
fri3:{av:"#7a9a5b",c:"晴",d:"学校走廊，午休时间。镜头对着一个女生的背影，她坐在窗边看书，阳光打在头发上。镜头慢慢拉近，然后突然被她发现，她回过头瞪了一眼，伸手挡住镜头。画面黑了。",cap:"我们学校最好看的学姐 #校园",th:"这丫头。别乱拍别人。",mutual:1},
fri4:{av:"#c9a227",c:"陈",d:"深夜里的一台笔记本，屏幕上跑着模型训练的日志，一行行往上滚。旁边是一杯黑咖啡和一个空的烟盒。镜头晃过窗外的香港，天还没亮。画外音：「跑通了。」然后就没了。",cap:"第41天 #量化 #深夜",th:"……41天。他比我能熬。",mutual:1},
work1:{av:"#3a3a3e",c:"砚",d:"一张书桌的俯拍。台灯只开了一盏，光打在键盘上。屏幕上是一段写了一半的代码，光标在闪。右下角放着一个马克杯，杯子里还有一点凉掉的咖啡。镜头静止了十几秒，只有光标在闪。",cap:"三点。 #深夜 #代码",th:"我拍的。拍的时候没想什么，就是想记一下这个时间点。",me:1},
work2:{av:"#3a3a3e",c:"砚",d:"一把白色键盘的特写。键帽是新的，灯光斜着打过来，能看到键帽表面的细微纹理。镜头缓慢地推近，最后停在空格键上——上面有一道很浅的划痕。",cap:"换了。 #键盘",th:"划痕是之前那把留下的。她按的。我没擦。",me:1},
work3:{av:"#3a3a3e",c:"砚",d:"显示器上的代码，滚动得很慢。是一段优化过的算法，注释写得很干净。镜头拉远，能看到整个屏幕，然后画面右下角出现了一只手的影子，把光标移到最上面一行，停住了。",cap:"跑通了。 #代码 #量化",th:"跑通的时候是凌晨四点。想找人说，但是没发。",me:1},
work4:{av:"#3a3a3e",c:"砚",d:"一杯手冲咖啡，滤杯还在滴水。光线从侧面来，能看到杯口的热气。桌面上放着一小袋咖啡豆，包装上印着产地。镜头停了三秒，然后一只手伸进来，把杯子端走了。",cap:"。",th:"她送的豆子。我拍了，没@她。她应该会刷到。",me:1},
work5:{av:"#3a3a3e",c:"砚",d:"一只白色的兔子玩偶被放在椅子上，四十厘米，摆得很正，脸朝着镜头。背景是普通房间，光线偏暗。画面里没有任何人，也没有声音。镜头就这么拍了二十秒。",cap:"",th:"不是我的。放这儿而已。……别问。",me:1},
work6:{av:"#3a3a3e",c:"砚",d:"窗外的雨。玻璃上全是水痕，把楼和天糊成一片灰蓝。窗台上放着一把折叠伞，伞是干的。镜头偶尔会被水痕挡住，然后慢慢清晰。远处有一栋楼的灯亮着。",cap:"香港的雨。",th:"拍的时候在想，她带伞了没有。",me:1},
fav1:{av:"#0984e3",c:"键",d:"键盘评测。博主拆开键帽，展示轴体的结构，一边拆一边讲手感。镜头切换到打字测试，声音很轻。最后他总结说，这把适合深夜用，不吵到人。",cap:"静电容键盘深度评测 深夜码农的救星 #键盘",th:"收藏了。买之前看了三遍。"},
fav2:{av:"#00b894",c:"香",d:"香薰蜡烛的制作过程。融蜡、加精油、倒模、插芯，全程慢镜头。最后点燃，火焰很小，烟很细。博主说雪松的味道能让人静下来。",cap:"在家做一支雪松香薰 #香薰 #手作",th:"她说睡不好。我查了很多，最后买了现成的。这个收藏着，以后可以自己做。"},

function tab(i,el){
  document.querySelectorAll('.ctabs div').forEach(function(d){d.classList.remove('on')});el.classList.add('on');

function openOne(k){
  document.getElementById('feed').innerHTML=vcard(k);

function go(i){
  page=i;
  var ids=['pHome','pFri','pMsg','pMe'];
  ids.forEach(function(id,k){document.getElementById(id).classList.toggle('on',k==(i==2?0:i))});
  document.querySelectorAll('.tab').forEach(function(t,k){t.classList.toggle('on',k==i)});
  var dark=(i==0||i==1);
  document.getElementById('tabbar').classList.toggle('light',!dark);
  if(i==3){buildMsg();document.getElementById('pMsg').classList.add('on');document.getElementById('pHome').classList.remove('on')}
  if(i==4){buildMe();document.getElementById('pMe').classList.add('on');document.getElementById('pHome').classList.remove('on')}

  if(i==1){document.getElementById('pFri').classList.add('on');document.getElementById('pMsg').classList.remove('on');document.getElementById('pMe').classList.remove('on')}

function pick(el,type){
  var f=el.querySelector('input').files[0];if(!f)return;
  var u=URL.createObjectURL(f);
  if(type=='bg'){el.style.backgroundImage='url('+u+')';el.childNodes[0].nodeValue='';}
  else{el.style.backgroundImage='url('+u+')';el.childNodes[0].nodeValue='';}
}
